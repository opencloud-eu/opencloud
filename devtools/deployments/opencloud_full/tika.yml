---
services:
  tika:
    image: ${TIKA_IMAGE:-apache/tika:4.2.0-SNAPSHOT-full}
    # release notes: https://tika.apache.org
    environment:
      # the thumbnail preset ships inert, this activates it, Tika 4.2.0 or newer
      TIKA_PRESETS: thumbnail
    networks:
      opencloud-net:
    restart: always
    logging:
      driver: ${LOG_DRIVER:-local}

  opencloud:
    environment:
      # fulltext search
      SEARCH_EXTRACTOR_TYPE: tika
      OC_TIKA_URL: http://tika:9998
      FRONTEND_FULL_TEXT_SEARCH_ENABLED: "true"
